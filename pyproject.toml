[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["lvlspy*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"lvlspy.extensions.io.xml" = [
  "xsd_pub/catalog",
  "xsd_pub/*.xsd",
  "xsd_pub/README.md",
]

[tool.setuptools.dynamic]
version = {attr = "lvlspy.__about__.__version__"}

[tool.black]
line-length = 79
target-version = ["py39", "py310", "py311", "py312", "py313"]

[project]
name = "lvlspy"
dynamic = ["version"]
description = "Python project to work with quantum level system data"
readme = "README.rst"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Clemson University", email = "jtannou@g.clemson.edu"},
]
keywords = ["astronomy", "nuclear astrophysics"]
dependencies = ["gslconsts", "lxml", "numpy", "scipy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
dev = ["check-manifest"]
test = ["coverage", "pytest", "requests"]

[project.urls]
Documentation = "https://lvlspy.readthedocs.io"
Repository = "https://github.com/jaadt7/lvlspy.git"
"Bug Tracker" = "https://github.com/jaadt7/lvlspy/issues"
