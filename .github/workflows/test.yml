name: pytest

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install dependencies
        run: |
          python -m pip install --upgrade \
            "pip==25.3; python_version < '3.10'" \
            "pip==26.1.2; python_version >= '3.10'"
          python -m pip install -e . -r .github/requirements-test.txt
      - name: run test
        run: |
          pytest -v tests
          pytest -v .github/workflows/lvlspy_test.py
