name: pylint
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -e . -r .github/requirements-lint.txt
      - name: run linter
        run: |
          pylint --extension-pkg-whitelist=lxml.etree --fail-under=9.9 lvlspy
